name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Unzip project archive
        run: |
          unzip -o nabil-silence.zip -d extracted_project
          cp -rn extracted_project/*/* . 2>/dev/null || cp -rn extracted_project/* . 2>/dev/null || true
          rm -rf extracted_project nabil-silence.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        run: gradle assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-release
          path: '**/build/outputs/apk/release/*.apk'
